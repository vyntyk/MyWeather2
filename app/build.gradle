plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization' version '2.0.20'
    id 'org.jetbrains.kotlin.kapt'
    id 'com.google.dagger.hilt.android'
    id 'jacoco'
}

jacoco {
    toolVersion = '0.8.12'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
def weatherMapApiKey = localProperties.getProperty(
        'OPENWEATHER_API_KEY',
        System.getenv('OPENWEATHER_API_KEY') ?: ''
)

android {
    namespace = 'com.home.myweather'

    compileSdk = 36


    defaultConfig {
        applicationId "com.home.myweather"
        minSdk = 35
        targetSdk = 36
        versionCode 55
        versionName "2.1"

        buildConfigField "String", "OPENWEATHER_API_KEY", groovy.json.JsonOutput.toJson(weatherMapApiKey)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig = true
        viewBinding = true
    }

    buildTypes {
        release {
            minifyEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            enableUnitTestCoverage = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
            jvmTarget = '17'
        }

        // Enable JUnit 5 for unit tests
        testOptions {
            unitTests.returnDefaultValues = true
            unitTests.all {
                useJUnitPlatform()
                jvmArgumentProviders.add(new org.gradle.process.CommandLineArgumentProvider() {
                    @Override
                    Iterable<String> asArguments() {
                        return [
                                "-javaagent:${project.configurations.mockitoAgent.singleFile.absolutePath}",
                                "-Xshare:off"
                        ]
                    }
                })
            }
        }

        packaging {
        jniLibs {
            keepDebugSymbols.add('**/libmaplibre.so')
        }
    }
}

configurations {
    mockitoAgent
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.test:core:1.7.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.activity:activity-ktx:1.9.3'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.2.0'
    implementation 'org.maplibre.gl:android-sdk:12.2.2'
    implementation 'org.maplibre.gl:android-plugin-annotation-v9:3.0.2'

    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.7.3'

    implementation 'androidx.room:room-runtime:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'

    implementation 'androidx.fragment:fragment-ktx:1.8.4'
    implementation 'androidx.fragment:fragment-testing:1.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'

    implementation 'androidx.navigation:navigation-fragment-ktx:2.8.3'
    implementation 'androidx.navigation:navigation-ui-ktx:2.8.3'
    implementation 'androidx.navigation:navigation-compose:2.8.3'

    implementation 'androidx.compose.ui:ui:1.7.5'
    implementation 'androidx.compose.ui:ui-tooling-preview:1.7.5'
    implementation 'androidx.compose.material3:material3:1.3.1'
    implementation 'androidx.compose.runtime:runtime-livedata:1.7.5'
    implementation 'androidx.compose.runtime:runtime-rxjava2:1.7.5'
    implementation 'androidx.compose.foundation:foundation:1.7.5'

    debugImplementation 'androidx.compose.ui:ui-tooling:1.7.5'
    debugImplementation 'androidx.compose.ui:ui-test-manifest:1.7.5'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
        testImplementation 'org.junit.jupiter:junit-jupiter-params:5.10.2'
        testImplementation 'org.mockito:mockito-core:5.11.0'
        mockitoAgent 'net.bytebuddy:byte-buddy-agent:1.14.12'
        testImplementation 'org.robolectric:robolectric:4.12.1'
        testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
        testImplementation 'com.google.truth:truth:1.1.5'
        testImplementation 'org.assertj:assertj-core:3.25.3'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.10.0'
        testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'

        androidTestImplementation 'androidx.test.ext:junit:1.2.1'
        androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-contrib:3.6.1'
        androidTestImplementation 'androidx.test:rules:1.6.1'
        androidTestImplementation 'androidx.test:runner:1.6.1'
        androidTestImplementation 'androidx.compose.ui:ui-test-junit4:1.7.5'
        androidTestImplementation 'androidx.test.ext:truth:1.6.0'
        androidTestImplementation 'org.mockito:mockito-core:5.11.0'
    androidTestImplementation 'androidx.arch.core:core-testing:2.2.0'
    androidTestImplementation 'org.hamcrest:hamcrest:2.2'
    
    kapt 'com.google.dagger:hilt-compiler:2.52'

    implementation 'com.google.dagger:hilt-android:2.52'

    
    implementation 'androidx.hilt:hilt-navigation-compose:1.2.0'
}
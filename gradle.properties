android.useAndroidX=true
android.enableJetifier=false
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.suppressUnsupportedCompileSdk=36
org.gradle.java.home=C:\\Program Files\\Java\\jdk-17
ksp.incremental=false
ksp.useK2=false
# Защита от известного бага kapt: инкрементальная обработка kapt + Room
# даёт спорадический "processingEnv must not be null" (NPE в RoomProcessor).
# Отключаем инкрементальный kapt — стоимость: чуть медленнее пересборка,
# зато стабильно (Room/Hilt собираются через kapt).
kapt.incremental.apt=false